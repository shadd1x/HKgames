<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Inventario de juegos - PS5, PS4, Nintendo, Xbox" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Inventario Juegos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <h1>🎮 Inventario</h1>
        <button id="installBtn" class="btn-install hidden" title="Instalar app">⬇️ Instalar</button>
      </div>
      <div class="currency-bar">
        <label>
          1 USD =
          <input type="number" id="rateInput" value="6.96" min="0" step="0.01" />
          BOB
        </label>
        <span class="rate-note">Tasa actual</span>
      </div>
      <div class="search-box">
        <input type="search" id="searchInput" placeholder="Buscar juego por nombre..." autocomplete="off" />
        <button id="clearSearch" class="btn-clear hidden" aria-label="Limpiar">✕</button>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <!-- Generated by JS -->
    </nav>

    <main class="content" id="content">
      <div class="loading">Cargando inventario...</div>
    </main>

    <footer class="footer">
      <span id="stats"></span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
